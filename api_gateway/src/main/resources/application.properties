server.port=8080

spring.application.name=api-gateway

# API prefix for authentication filter
app.api-prefix=/api/v1

# Gateway routing configuration
# Enable service discovery in Gateway
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes are now configured in GatewayConfiguration.java

# Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8888/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# SpringDoc Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Content Service
springdoc.swagger-ui.urls[1].url=/content-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Payment Service
springdoc.swagger-ui.urls[2].url=/payment-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Wallet Service
springdoc.swagger-ui.urls[3].url=/wallet-service/v3/api-docs

# ================================
# Logging Configuration
# ================================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.api_gateway.api_gateway=INFO
logging.level.reactor.netty=INFO
logging.level.org.springdoc=DEBUG


# JWT
# ================================
jwt.secret=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij

# ================================
# Actuator Health Checks
# ================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.export.simple.enabled=true

# ================================
# Resilience4j Circuit Breaker
# ================================
# Default configuration for all circuit breakers
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=100
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s

# ================================
# Resilience4j Retry
# ================================
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2

# ================================
# Resilience4j Time Limiter
# ================================
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.configs.default.cancel-running-future=true

